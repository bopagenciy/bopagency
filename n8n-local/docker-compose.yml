services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: bop-n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    env_file:
      - .env

    environment:
      - N8N_PORT=${N8N_PORT}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_PERSONALIZATION_ENABLED=${N8N_PERSONALIZATION_ENABLED}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_RESTRICT_FILE_ACCESS_TO=${N8N_RESTRICT_FILE_ACCESS_TO}
      # Phase 6 — integración local con BopIAgency (Next.js en el host).
      # Permite que el nodo Code de firma HMAC del workflow local lea
      # AUTOMATION_WEBHOOK_SECRET vía $env sin bloqueo de acceso a env vars.
      # RIESGO ACEPTADO SOLO EN LOCAL: en 'false', cualquier nodo Code puede
      # leer TODAS las env vars del contenedor, no solo AUTOMATION_WEBHOOK_SECRET.
      # NO recomendado para producción/staging compartido — ahí usar 'true'
      # (bloqueado) y credenciales nativas de n8n en vez de $env para secretos.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      # Secreto HMAC compartido con BopIAgency. Se lee de n8n-local/.env
      # (nunca hardcodeado aquí). Debe coincidir con
      # AUTOMATION_WEBHOOK_SECRET en apps/web/.env.local.
      - AUTOMATION_WEBHOOK_SECRET=${AUTOMATION_WEBHOOK_SECRET}
      - NODE_FUNCTION_ALLOW_BUILTIN=${NODE_FUNCTION_ALLOW_BUILTIN:-crypto}
      - N8N_RUNNERS_STDLIB_ALLOW=${N8N_RUNNERS_STDLIB_ALLOW:-crypto}


    # Permite que el contenedor resuelva host.docker.internal para llamar de
    # vuelta a Next.js (http://host.docker.internal:3200), que corre en el
    # host, no en Docker. En Docker Desktop (Windows/Mac) esto ya funciona
    # por defecto; extra_hosts lo garantiza también en Docker Engine (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ../shared-data:/shared-data
      - ../.agencia-ai:/agencia-ai:ro
      # Phase 6 — workflow local de prueba de integración (solo lectura).
      - ./workflows:/workflows:ro

volumes:
  n8n_data: